<p-menubar class="shadow-sm border-round" style="border: 1px solid #e0e0e0;">
  <ng-template pTemplate="start">
    <span class="text-lg font-bold text-primary navbar-title">Shipping App 🚚</span>
  </ng-template>

  <ng-template pTemplate="end">
    <!-- Main Navigation Buttons -->
    <button pButton
            class="p-button-text p-button-sm nav-button"
            routerLink="/">
      <i class="pi pi-home"></i> Home
    </button>

    <button pButton
            class="p-button-text p-button-sm nav-button"
            routerLink="/order-form">
      <i class="pi pi-plus"></i> New Order
    </button>

    <button pButton
            class="p-button-text p-button-sm nav-button"
            routerLink="/orders">
      <i class="pi pi-box"></i> Orders
    </button>

    <button pButton
            class="p-button-text p-button-sm nav-button"
            routerLink="/dashboard">
      <i class="pi pi-chart-bar"></i> Dashboard
    </button>

    <button pButton
            class="p-button-text p-button-sm nav-button"
            routerLink="/settings">
      <i class="pi pi-cog"></i> Settings
    </button>

    <!-- Login Button -->
    <button pButton
            class="p-button-raised p-button-sm navbar-button"
            routerLink="/login">
      Login
    </button>
  </ng-template>
</p-menubar>
