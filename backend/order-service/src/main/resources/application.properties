# === Existing configs ===
spring.application.name=order-service
spring.data.mongodb.uri=mongodb://localhost:27017/Order_db
spring.cloud.discovery.enabled=true
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
spring.cloud.config.enabled=false
spring.data.rest.base-path=/api
management.endpoints.web.exposure.exclude=*

# === Keycloak Integration (backend JWT validation only) ===
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/stage-shipping-realm
