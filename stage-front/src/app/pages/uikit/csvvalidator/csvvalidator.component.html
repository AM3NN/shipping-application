<p-toast></p-toast>

<!-- Spinner -->
<div class="spinner-wrapper" *ngIf="loading">
    <p-progressSpinner></p-progressSpinner>
</div>

<!-- Error Message -->
<p *ngIf="errorMsg" class="error-msg">{{ errorMsg }}</p>

<!-- Valid Products Table -->
<div class="section">
    <h2 class="section-title success"> Valid Products</h2>

    <p-table *ngIf="validProducts.length > 0"
             [value]="validProducts"
             [paginator]="true"
             [rows]="10"
             [responsiveLayout]="'scroll'"
             [rowsPerPageOptions]="[5,10,20]"
             styleClass="p-datatable-compact shadow rounded">

        <!-- Header -->
        <ng-template pTemplate="header">
            <tr>
                <th>Product Attributes</th>
                <th>Action</th>
            </tr>
        </ng-template>

        <!-- Body -->
        <ng-template pTemplate="body" let-product>
            <tr>
                <td>
                    <div class="field-grid">
                        <div class="field-item" *ngFor="let field of product | keyvalue">
                            <span class="field-key-badge">{{ field.key }}:</span>
                            <span class="field-value-badge">{{ field.value }}</span>
                        </div>
                    </div>
                </td>
                <td>
                    <button pButton type="button" label=" Database" icon="pi pi-plus"
                            class="p-button-success"
                            (click)="addToDatabase(product)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p *ngIf="!loading && validProducts.length === 0" class="empty-msg">
        No valid products found.
    </p>
</div>


<!-- Invalid Products Table -->
<div class="section mt-5">
    <h2 class="section-title warning"> Invalid Products</h2>

    <p-table *ngIf="invalidProducts.length > 0"
             [value]="invalidProducts"
             [paginator]="true"
             [rows]="10"
             [responsiveLayout]="'scroll'"
             [rowsPerPageOptions]="[5,10,20]"
             styleClass="p-datatable-compact shadow rounded">

        <!-- Header -->
        <ng-template pTemplate="header">
            <tr>
                <th>Product Attributes</th>
                <th>Invalid Fields</th>
                <th>Action</th>
            </tr>
        </ng-template>

        <!-- Body -->
        <ng-template pTemplate="body" let-line>
            <tr>
                <td>
                    <div class="field-grid">
                        <div class="field-item" *ngFor="let field of line.product | keyvalue"
                             [ngClass]="{'invalid-field': isInvalid(line, field.key)}">
                            <span class="field-key-badge">{{ field.key }}</span>
                            <span class="field-value-badge invalid-field-badge">{{ field.value }}</span>
                        </div>
                    </div>
                </td>
                <td>
                    <ng-container *ngFor="let error of line.errors | keyvalue">
                        <span class="error-badge">{{ error.key }}: {{ error.value }}</span>
                    </ng-container>
                </td>
                <td>
                    <button pButton type="button" label=" Fields" icon="pi pi-pencil"
                            class="p-button-warning"
                            (click)="modifyFields(line)"></button>
                </td>
            </tr>
        </ng-template>
    </p-table>

    <p *ngIf="!loading && invalidProducts.length === 0" class="empty-msg">
        No invalid products found.
    </p>
</div>
<p-dialog header="Modify Fields" [(visible)]="displayDialog" [modal]="true" [style]="{width: '500px'}">
    <div *ngIf="selectedLine">
        <div class="p-fluid">
            <div *ngFor="let error of (selectedLine.errors || {}) | keyvalue">
                <div class="p-field">
                    <label>{{ error.key }}</label>
                    <input pInputText [(ngModel)]="selectedLine.product[error.key]" />
                </div>
            </div>
        </div>
    </div>

    <ng-template pTemplate="footer">
        <button pButton label="Cancel" icon="pi pi-times" class="p-button-text" (click)="displayDialog=false"></button>
        <button pButton label="Save" icon="pi pi-check" class="p-button-success" (click)="saveModifiedFields()"></button>
    </ng-template>
</p-dialog>
