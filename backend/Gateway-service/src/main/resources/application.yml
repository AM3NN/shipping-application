server:
  port: 8888

spring:
  application:
    name: gateway-service

  cloud:
    gateway:
      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders/**

        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user/**
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true

    config:
      enabled: false

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true