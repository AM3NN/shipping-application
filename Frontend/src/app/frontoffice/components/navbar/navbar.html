<p-menubar [model]="items" class="shadow-sm border-round" style="border: 1px solid #e0e0e0;">
  <ng-template pTemplate="start">
    <span class="text-lg font-bold text-primary navbar-title">Shipping App 🚚</span>
  </ng-template>

  <ng-template pTemplate="end">
    <button class="p-button-text p-button-sm navbar-button" routerLink="/login">Login</button>
  </ng-template>

</p-menubar>
