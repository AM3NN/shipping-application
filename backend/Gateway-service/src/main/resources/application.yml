server:
  port: 8888

spring:
  application:
    name: gateway-service

  main:
    web-application-type: reactive
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8080/realms/test
  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders/**
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/**
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/product-service/**
          filters:
            - StripPrefix=1
        - id: shipping-service
          uri: lb://SHIPPING-SERVICE
          predicates:
          - Path=/shipping-service/**
        - id: product-service-swagger
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/products/v3/api-docs
        - id: user-service-swagger
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user/v3/api-docs
        - id: shipping-service-swagger
          uri: lb://SHIPPING-SERVICE
          predicates:
            - Path=/shipping/v3/api-docs
      server:
        webflux:
          discovery:
            locator:
              lower-case-service-id: true
              enabled: false

springdoc:
  swagger-ui:
    urls:
      - name: gateway
        url: /v3/api-docs
      - name: order-service
        url: /orders/v3/api-docs
      - name: user-service
        url: /user/v3/api-docs
      - name: product-service
        url: /products/v3/api-docs
      - name: shipping-service
        url: /shipping/v3/api-docs

  api-docs:
    path: /v3/api-docs
  show-actuator: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
logging:
  level:
    org.springframework.security: DEBUG
    org.springframework.cloud.gateway: DEBUG
    reactor.netty: DEBUG
app:
  swagger:
       gateway-mode: true