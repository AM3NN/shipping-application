server:
  port: 8888

spring:
  application:
    name: gateway-service

  main:
    web-application-type: reactive

  cloud:
    config:
      enabled: false
    gateway:
      routes:
        - id: order-service
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/orders/**
        - id: user-service
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user/**
        - id: product-service
          uri: lb://PRODUCT-SERVICE
          predicates:
            - Path=/products/**

      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

springdoc:
  swagger-ui:
    urls:
      - name: gateway
        url: /v3/api-docs
      - name: order-service
        url: /orders/v3/api-docs
      - name: user-service
        url: /user/v3/api-docs
      - name: product-service
        url: /products/v3/api-docs

  api-docs:
    path: /v3/api-docs
  show-actuator: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
