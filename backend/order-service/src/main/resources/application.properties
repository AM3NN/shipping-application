spring.application.name=order-service
spring.data.mongodb.uri=mongodb://localhost:27017/Order_db
spring.cloud.discovery.enabled=true
server.port=8081
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
spring.cloud.config.enabled=false
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/orders/v3/api-docs
# Adresse du serveur Kafka
# Serveur Kafka
# Kafka Consumer Configuration
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=tn.epac.orderservice.Entities
spring.kafka.bootstrap-servers=localhost:9092

# Disable Docker Compose and OpenAI if not needed
spring.docker.compose.enabled=false
spring.autoconfigure.exclude=org.springframework.ai.autoconfigure.openai.OpenAiAutoConfiguration

